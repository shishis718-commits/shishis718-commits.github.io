# Apple Planet — Decap CMS
# Setup: create a Decap Turbo site for this repository, then replace the Site ID below.
backend:
  name: turbo-github
  turbo_site_id: REPLACE_WITH_DECAP_TURBO_SITE_ID
  branch: main

site_url: https://shishis718-commits.github.io
display_url: https://shishis718-commits.github.io
locale: zh_Hans

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:
  - name: "planet"
    label: "苹果星球"
    files:
      - name: "articles"
        label: "文章管理"
        file: "content/posts.json"
        description: "在这里创建、修改和删除四个分类页面的文章。保存后会自动提交到 GitHub。"
        fields:
          - label: "文章列表"
            name: "articles"
            widget: "list"
            label_singular: "一篇文章"
            summary: "{{fields.title}} · {{fields.category}}"
            collapsed: true
            fields:
              - label: "文章标题"
                name: "title"
                widget: "string"
              - label: "分类"
                name: "category"
                widget: "select"
                options:
                  - { label: "日常生活", value: "daily" }
                  - { label: "书影音", value: "culture" }
                  - { label: "同人档案", value: "fanworks" }
                  - { label: "兴趣收藏", value: "interests" }
              - label: "发布日期"
                name: "date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
              - label: "简短摘要"
                name: "excerpt"
                widget: "text"
                required: false
              - label: "封面图片"
                name: "cover"
                widget: "image"
                required: false
              - label: "正文"
                name: "body"
                widget: "markdown"
                buttons: ["bold", "italic", "code", "link", "bulleted-list", "numbered-list"]
                editor_components: []