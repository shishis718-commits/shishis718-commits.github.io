# Apple Planet — Decap CMS
backend:
  name: turbo-github
  turbo_site_id: 87826d77-8e0f-46eb-9ef4-e0bfe34fdd06
  branch: main

site_url: https://shishis718-commits.github.io
display_url: https://shishis718-commits.github.io
locale: zh_Hans
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
publish_mode: simple

collections:
  - name: "planet"
    label: "苹果星球"
    files:
      - name: "articles"
        label: "时间轴内容"
        file: "content/posts.json"
        description: "所有内容都会汇入首页时间轴。用标签整理内容，不再区分固定板块；最新发布的内容显示在最上方。"
        fields:
          - label: "发布内容"
            name: "articles"
            widget: "list"
            label_singular: "一条内容"
            summary: "{{fields.date}} · {{fields.title}}"
            collapsed: true
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - label: "标签"
                name: "tags"
                widget: "list"
                required: false
                field: { label: "标签名称", name: "tag", widget: "string" }
              - label: "发布日期"
                name: "date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
              - { label: "简短摘要", name: "excerpt", widget: "text", required: false }
              - { label: "封面图片", name: "cover", widget: "image", required: false }
              - { label: "下载链接", name: "download", widget: "string", required: false }
              - label: "正文"
                name: "body"
                widget: "markdown"
                buttons: ["bold", "italic", "code", "link", "bulleted-list", "numbered-list"]
                editor_components: []
